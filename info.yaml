# Tiny Tapeout project information
project:
  title:        "Protocol emulator CPU (UART + SPI + I2C firmware)"      # Project title
  author:       "atlasmountainz"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable protocol emulator ASIC - tiny cycle-exact CPU running UART, SPI or I2C firmware from ROM"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000  # 50 MHz: the UART and I2C firmware timing assume this clock

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_atlasmountainz_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "cpu.v"
    - "pmem.v"
    - "pc_rep.v"
    - "rom.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA0"
  ui[1]: "DATA1"
  ui[2]: "DATA2"
  ui[3]: "DATA3"
  ui[4]: "DATA4"
  ui[5]: "DATA5"
  ui[6]: "DATA6"
  ui[7]: "DATA7"

  # Outputs
  uo[0]: "UART_TX / SPI_CS_N"
  uo[1]: "UART_BUSY / SPI_SCK"
  uo[2]: "SPI_MOSI"
  uo[3]: "SPI_BUSY / I2C_BUSY"
  uo[4]: "I2C_ERR (slave NACK)"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "START"
  uio[1]: "SPI_MISO"
  uio[2]: "I2C_SCL (open-drain)"
  uio[3]: "I2C_SDA (open-drain)"
  uio[4]: "LOAD_STROBE (program loader)"
  uio[5]: "LOAD (1 = load program memory)"
  uio[6]: "MODE_I2C (1=I2C)"
  uio[7]: "MODE_SPI (1=SPI)"

# Do not change!
yaml_version: 6
